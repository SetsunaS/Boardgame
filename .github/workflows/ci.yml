name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Docker est préinstallé sur ubuntu-latest : les tests Testcontainers tournent aussi en CI
      # chmod : le bit exécutable de mvnw se perd facilement depuis Windows
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            echo "## Couverture de code" >> $GITHUB_STEP_SUMMARY
            awk -F, 'NR>1 {covered+=$9; missed+=$8} END {printf "**Lignes couvertes : %.1f%%** (%d/%d)\n", 100*covered/(covered+missed), covered, covered+missed}' target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
